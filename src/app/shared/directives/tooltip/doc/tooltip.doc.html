<app-documentation-template title="Buttons">
  <div examples>
    <app-flex direction="column" gap="lg">
      <app-flex direction="column" gap="sm">
        <h3>Texte simple</h3>
        <app-flex direction="row" gap="md" wrap>
          @for (position of positions; track $index) {
            <app-button
              [text]="position.charAt(0).toUpperCase() + position.slice(1)"
              variant="solid"
              color="blue"
              size="sm"
              [tooltip]="{
                content: 'Tooltip ' + position,
                position: position,
              }"
            />
          }
        </app-flex>
      </app-flex>

      <app-flex direction="column" gap="sm">
        <h3>Contenu personnalisé</h3>
        <app-flex direction="row" gap="md" wrap>
          <app-button
            text="Template"
            variant="solid"
            color="blue"
            size="sm"
            [tooltip]="{
              content: customTooltip,
              position: 'top',
            }"
          />
        </app-flex>
      </app-flex>
    </app-flex>

    <ng-template #customTooltip>
      <div style="padding: 0.5rem">
        <strong>Contenu riche</strong>
        <p style="margin: 0.25rem 0">Vous pouvez mettre du HTML personnalisé ici</p>
        <small style="color: var(--color-text-secondary)">Avec des styles, des icônes, etc.</small>
      </div>
    </ng-template>
  </div>

  <div properties>
    <!-- Propriétés du composant accordion -->
  </div>

  <div usage>
    <!-- Instructions d'utilisation -->
  </div>
</app-documentation-template>
