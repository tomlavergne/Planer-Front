<!--  Content in which the circles are displayed -->
<ng-content></ng-content>

<!-- Circles -->
@for (ripple of ripples; track ripple) {
  <span
    class="ripple-circle"
    [style.left.px]="ripple.x"
    [style.top.px]="ripple.y"
    [style.width.px]="ripple.size"
    [style.height.px]="ripple.size"
    [style.background-color]="getColor()"
    [style.animation-duration.ms]="duration()"
  ></span>
}
