<app-flex [direction]="direction() === 'row' ? 'column' : 'row'" gap="xs" fullWidth>
  <!-- Tab List -->
  <app-flex [direction]="direction()" gap="xs">
    @for (tab of tabs(); track tab.id) {
      <app-button
        [text]="tab.label"
        [variant]="isActive(tab.id) ? 'soft' : 'ghost'"
        [color]="isActive(tab.id) ? 'primary' : 'secondary'"
        [disabled]="tab.disabled"
        (clicked)="selectTab(tab)"
      />
    }
  </app-flex>

  <app-separator />

  <!-- Tab Panels - Affiche uniquement le panel actif -->
  <div class="tabs-content">
    @for (panel of panels; track panel.appTabPanel()) {
      @if (isActive(panel.appTabPanel())) {
        <ng-container *ngTemplateOutlet="panel.template"></ng-container>
      }
    }
  </div>
</app-flex>
