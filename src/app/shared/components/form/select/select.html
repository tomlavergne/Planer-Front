<!-- Trigger -->
<app-button
  #selectButton
  [text]="selectedOption()?.label || placeholder()"
  variant="soft"
  [iconRight]="'lucideChevronDown'"
  [disabled]="disabled()"
  [popover]="{
    content: dropdownTemplate,
    position: 'bottom',
    offsetY: popoverOffset(),
  }"
  (popoverOpened)="onPopoverOpened()"
/>

<!-- Dropdown -->
<ng-template #dropdownTemplate>
  <app-flex direction="column" padding="2xs" gap="2xs">
    @for (option of options(); track option.value) {
      <app-button
        [text]="option.label"
        [variant]="value() === option.value ? 'soft' : 'ghost'"
        [iconRight]="value() === option.value ? 'lucideCheck' : null"
        [disabled]="option.disabled"
        fullWidth
        (clicked)="selectOption(option)"
      />
    }
  </app-flex>
</ng-template>
