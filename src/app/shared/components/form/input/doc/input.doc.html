<app-documentation-template
  title="Input"
  introduction="Le composant Input est un champ de saisie de texte qui permet à l'utilisateur d'entrer et de modifier du texte. Il est couramment utilisé dans les formulaires pour collecter des informations telles que le nom, l'adresse e-mail, le mot de passe, etc."
  showUsageTab
>
  <app-flex usage direction="column" gap="2xl" wrap fullWidth>
    <!-- Basic -->
    <app-flex direction="column" [gap]="documentationTemplateConfig.usage.gap" fullWidth>
      <app-text
        [size]="documentationTemplateConfig.usage.title.size"
        [weight]="documentationTemplateConfig.usage.title.weight"
        [color]="documentationTemplateConfig.usage.title.color"
      >
        Basic
      </app-text>

      <app-card>
        <app-preview limitHeight>
          <app-flex direction="column">
            <app-flex direction="row" gap="md" alignItems="center" padding="sm" wrap>
              <app-input-number [(value)]="inputNumberValue" showControls onlyPositive />

              <p>Valeur de l'input number : {{ inputNumberValue() }}</p>
            </app-flex>

            <app-flex direction="row" gap="md" alignItems="center" padding="sm" wrap>
              <app-input-search [(value)]="inputSearchValue" showClearButton />

              <p>Valeur de l'input search : {{ inputSearchValue() }}</p>
            </app-flex>

            <app-flex direction="row" gap="md" alignItems="center" padding="sm" wrap>
              <app-input-email [(value)]="inputEmailValue" />

              <p>Valeur de l'input search : {{ inputEmailValue() }}</p>
            </app-flex>
          </app-flex>
        </app-preview>
      </app-card>

      <app-card>
        <app-preview limitHeight>
          <app-flex direction="column" fullWidth>
            <app-flex direction="column" gap="md" alignItems="center" padding="sm" wrap fullWidth>
              @for (size of sizes; track $index) {
                <app-input
                  [size]="size"
                  icon="lucideStar"
                  placeholder="Saisissez un nombre"
                  [actions]="actions()"
                  fullWidth
                />
              }
            </app-flex>
          </app-flex>
        </app-preview>
      </app-card>
    </app-flex>

    <!-- Groups -->
    <app-flex direction="column" [gap]="documentationTemplateConfig.usage.gap" fullWidth>
      <app-text
        [size]="documentationTemplateConfig.usage.title.size"
        [weight]="documentationTemplateConfig.usage.title.weight"
        [color]="documentationTemplateConfig.usage.title.color"
      >
        Groups
      </app-text>

      <app-card>
        <app-preview limitHeight>
          <app-flex direction="row" gap="md" alignItems="center" padding="sm" wrap>
            <!-- <app-select
              placeholder="Sélectionnez une option parmi les groupes"
              [groups]="groups"
              [value]="'2'"
            /> -->
          </app-flex>
        </app-preview>
      </app-card>
    </app-flex>
  </app-flex>
</app-documentation-template>
