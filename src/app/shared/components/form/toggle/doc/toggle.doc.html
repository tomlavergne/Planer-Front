<app-documentation-template
  title="Toggle"
  introduction="Le composant Toggle permet à l'utilisateur d'activer ou de désactiver une option en basculant entre deux états."
  [inputs]="inputsMetadata"
  [models]="modelsMetadata"
  [outputs]="outputsMetadata"
  showUsageTab
>
  <app-flex usage direction="column" gap="2xl" wrap fullWidth>
    <!-- Couleurs sémantiques -->
    <app-flex direction="column" [gap]="documentationTemplateConfig.usage.gap">
      <app-text
        [size]="documentationTemplateConfig.usage.title.size"
        [weight]="documentationTemplateConfig.usage.title.weight"
        [color]="documentationTemplateConfig.usage.title.color"
      >
        Couleurs sémantiques
      </app-text>

      <app-card>
        <app-preview limitHeight>
          <app-flex direction="row" gap="md" alignItems="center" padding="sm" wrap>
            @for (color of semanticColors; track $index) {
              <app-toggle
                [color]="color"
                size="md"
                borderRadius="full"
                [tooltip]="{
                  content: color,
                }"
              />
            }
          </app-flex>
        </app-preview>
      </app-card>
    </app-flex>

    <!-- Couleurs primaires -->
    <app-flex direction="column" gap="sm">
      <app-text
        [size]="documentationTemplateConfig.usage.title.size"
        [weight]="documentationTemplateConfig.usage.title.weight"
        [color]="documentationTemplateConfig.usage.title.color"
      >
        Couleurs primaires
      </app-text>

      <app-card>
        <app-preview limitHeight>
          <app-flex direction="row" gap="md" alignItems="center" padding="sm" wrap>
            @for (color of primaryColors; track $index) {
              <app-toggle
                [color]="color"
                size="md"
                borderRadius="full"
                [tooltip]="{
                  content: color,
                }"
              />
            }
          </app-flex>
        </app-preview>
      </app-card>
    </app-flex>

    <!-- Tailles -->
    <app-flex direction="column" [gap]="documentationTemplateConfig.usage.gap">
      <app-text
        [size]="documentationTemplateConfig.usage.title.size"
        [weight]="documentationTemplateConfig.usage.title.weight"
        [color]="documentationTemplateConfig.usage.title.color"
      >
        Tailles
      </app-text>

      <app-card>
        <app-preview>
          <app-flex direction="column" gap="sm" alignItems="center" justifyContent="center">
            <app-flex direction="row" gap="sm" alignItems="center" padding="sm" wrap>
              @for (size of sizes; track $index) {
                <app-toggle
                  color="cyan"
                  [size]="size"
                  borderRadius="full"
                  [tooltip]="{
                    content: size,
                  }"
                />
              }
            </app-flex>
          </app-flex>
        </app-preview>
      </app-card>
    </app-flex>

    <!-- Disabled -->
    <app-flex direction="column" [gap]="documentationTemplateConfig.usage.gap">
      <app-text
        [size]="documentationTemplateConfig.usage.title.size"
        [weight]="documentationTemplateConfig.usage.title.weight"
        [color]="documentationTemplateConfig.usage.title.color"
      >
        Disabled
      </app-text>

      <app-text
        [size]="documentationTemplateConfig.usage.description.size"
        [weight]="documentationTemplateConfig.usage.description.weight"
        [color]="documentationTemplateConfig.usage.description.color"
      >
        Le composant Toggle peut être désactivé pour indiquer qu'il n'est pas interactif.
      </app-text>

      <app-card>
        <app-preview>
          <app-flex
            direction="column"
            gap="sm"
            alignItems="center"
            justifyContent="center"
            padding="sm"
          >
            <app-toggle color="cyan" size="md" borderRadius="full" disabled />
          </app-flex>
        </app-preview>
        <app-code card-footer [code]="disabledExempleCode" copyable />
      </app-card>
    </app-flex>
  </app-flex>
</app-documentation-template>
