<app-documentation-template
  title="OTP (One-Time Password)"
  introduction="Composant pour saisir des codes de vérification à usage unique. Supporte la navigation automatique, le copier-coller et la validation en temps réel."
  [inputs]="inputsMetadata"
  [outputs]="outputsMetadata"
  showUsageTab
>
  <app-flex usage direction="column" gap="2xl" wrap fullWidth>
    <!-- Standard OTP -->
    <app-flex direction="column" [gap]="documentationTemplateConfig.usage.gap">
      <app-text
        [size]="documentationTemplateConfig.usage.title.size"
        [weight]="documentationTemplateConfig.usage.title.weight"
        [color]="documentationTemplateConfig.usage.title.color"
      >
        Standard (6 chiffres)
      </app-text>

      <app-card>
        <app-preview>
          <app-flex direction="column" gap="md" alignItems="center">
            <app-otp [(value)]="standardCode" [length]="6" />
            @if (standardCode()) {
              <app-text size="sm" color="text-secondary"> Valeur: {{ standardCode() }} </app-text>
            }
          </app-flex>
        </app-preview>
      </app-card>
    </app-flex>
  </app-flex>
</app-documentation-template>
