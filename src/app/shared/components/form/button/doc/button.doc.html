<app-documentation-template
  title="Button"
  introduction="Déclencher une action ou un événement en un clic, comme la soumission d'un formulaire ou l'affichage d'une boîte de dialogue.
  Les boutons contiennent généralement du texte qui indique l'action qu'ils effectuent."
  [inputs]="inputsMetadata"
  [outputs]="outputsMetadata"
  showUsageTab
>
  <app-flex usage direction="column" gap="2xl" wrap fullWidth>
    <!-- Contenu -->
    <app-documentation-usage
      title="Contenu"
      description="Le composant Button peut contenir du texte, des icônes ou des éléments personnalisés en utilisant la projection de contenu."
      [codeExample]="contentExempleCode"
    >
      <app-flex direction="row" gap="sm" alignItems="center" wrap>
        <app-button text="Text only" size="sm" variant="solid" color="primary" />

        <app-button size="sm" iconLeft="lucideStar" />

        <app-button size="sm">
          <app-flex direction="row" alignItems="center" gap="sm">
            <app-text size="sm" color="text-inverse" weight="medium">Custom Content</app-text>

            <app-icon color="text-primary" name="lucideStar" size="sm" />

            <app-text size="sm" color="text-inverse">Custom Content</app-text>
          </app-flex>
        </app-button>
      </app-flex>
    </app-documentation-usage>

    <!-- Variants -->
    <app-documentation-usage
      title="Variants"
      description="Le composant Button prend en charge plusieurs couleurs pour s'adapter à différents contextes
        d'utilisation."
      [codeExample]="variantExempleCode"
    >
      <app-flex direction="row" gap="sm" wrap>
        @for (variant of variants; track $index) {
          <app-button
            [text]="variant"
            [variant]="variant"
            color="primary"
            size="sm"
            borderRadius="full"
          />
        }
      </app-flex>
    </app-documentation-usage>

    <!-- Couleurs -->
    <app-documentation-usage
      title="Couleurs"
      description="Le composant Button prend en charge plusieurs couleurs pour s'adapter à différents contextes
        d'utilisation."
    >
      <app-flex direction="column" gap="lg" alignItems="center">
        <app-flex direction="row" gap="sm" wrap>
          @for (color of primaryColors; track $index) {
            <app-button
              [text]="color"
              [color]="color"
              variant="solid"
              size="sm"
              borderRadius="full"
            />
          }
        </app-flex>

        <app-flex direction="row" gap="sm" wrap>
          @for (color of semanticColors; track $index) {
            <app-button
              [text]="color"
              [color]="color"
              variant="solid"
              size="sm"
              borderRadius="full"
            />
          }
        </app-flex>
      </app-flex>
    </app-documentation-usage>

    <!-- Tailles -->
    <app-documentation-usage
      title="Tailles"
      description="Le composant Button prend en charge plusieurs tailles pour s'adapter à différents contextes
        d'utilisation."
      [codeExample]="sizeExempleCode"
    >
      <app-flex direction="column" gap="sm" alignItems="center" justifyContent="center">
        <app-flex direction="row" gap="sm" alignItems="center" wrap>
          @for (size of sizes; track $index) {
            <app-button [text]="size" [size]="size" />
          }
        </app-flex>

        <app-flex direction="row" gap="sm" alignItems="center" wrap>
          @for (size of sizes; track $index) {
            <app-button [size]="size" iconLeft="lucidePlus" />
          }
        </app-flex>

        <app-flex direction="row" gap="sm" alignItems="center" wrap>
          @for (size of sizes; track $index) {
            <app-button [text]="'Button ' + size" [size]="size" iconLeft="lucideStar" />
          }
        </app-flex>
      </app-flex>
    </app-documentation-usage>

    <!-- Disabled -->
    <app-documentation-usage
      title="Disabled"
      description="Le composant Button peut être désactivé pour indiquer qu'il n'est pas interactif."
      [codeExample]="disabledExempleCode"
    >
      <app-button text="Disabled" size="sm" color="primary" borderRadius="full" disabled />
    </app-documentation-usage>
  </app-flex>
</app-documentation-template>
