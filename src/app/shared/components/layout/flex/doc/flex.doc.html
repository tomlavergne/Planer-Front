<app-documentation-template
  title="Flex"
  introduction="
Le composant Flex est un conteneur flexible qui utilise le modèle de boîte flexible (Flexbox) pour organiser et aligner les éléments enfants de manière réactive et adaptable.
"
>
  <div overview>
    <app-flex direction="column" gap="lg" fullWidth>
      <app-flex direction="column" gap="md" wrap>
        @for (item of items; track $index) {
          <app-flex alignItems="center" justifyContent="center" padding="sm" class="item">
            <app-text color="foreground-primary-inverse">Div {{ $index + 1 }}</app-text>
          </app-flex>
        }
      </app-flex>

      <app-flex direction="row" gap="md">
        @for (item of items; track $index) {
          <app-flex
            direction="column"
            alignItems="center"
            justifyContent="center"
            padding="sm"
            class="item"
            fullWidth
          >
            <app-text color="foreground-primary-inverse">Div {{ $index + 1 }}</app-text>
          </app-flex>
        }
      </app-flex>
    </app-flex>
  </div>

  <div properties>
    <!-- Propriétés du composant accordion -->
  </div>

  <div usage>
    <!-- Instructions d'utilisation -->
  </div>
</app-documentation-template>
