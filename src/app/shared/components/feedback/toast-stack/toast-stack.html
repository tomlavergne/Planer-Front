<app-flex direction="column" padding="md">
  <!-- slice() crée une copie du tableau ce qui evite de modifier le signal original -->
  @for (toast of toastService.toasts().slice().reverse(); track toast.id; let i = $index) {
    <app-toast
      [attr.data-index]="i"
      [color]="toast.color!"
      [title]="toast.title ?? null"
      [message]="toast.message"
      [icon]="toast.icon"
      [dismissible]="toast.dismissible ?? true"
      [isDismissing]="toastService.dismissingToasts().has(toast.id)"
      (dismiss)="onDismiss(toast.id)"
      (mouseenter)="onMouseEnter()"
      (mouseleave)="onMouseLeave()"
    />
  }
</app-flex>
