<button [attr.type]="type()" [disabled]="disabled()" (click)="onClick()">
  <app-flex [direction]="direction()" alignItems="center" justifyContent="center" [gap]="size()">
    <!-- Icone -->
    @if (icon()) {
      <app-icon [name]="icon()!.name" [size]="iconSize()" [variant]="contentColor()"></app-icon>
    }

    <!-- Label -->
    @if (label()) {
      <app-text class="label" [variant]="contentColor()">{{ label() }}</app-text>
    }
  </app-flex>
</button>
