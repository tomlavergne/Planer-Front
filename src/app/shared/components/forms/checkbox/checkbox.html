<label class="checkbox-wrapper">
  <div class="checkbox-container">
    <input
      type="checkbox"
      [checked]="checked()"
      [disabled]="disabled()"
      [indeterminate]="indeterminate()"
      (change)="toggle()"
      class="checkbox-input"
    />
    <div class="checkbox-box">
      @if (indeterminate()) {
        <app-icon name="lucideMinus" [size]="size() === 'sm' ? '16' : '20'" />
      } @else if (checked()) {
        <app-icon name="lucideCheck" [size]="size() === 'sm' ? '16' : '20'" />
      }
    </div>
  </div>

  @if (label()) {
    <span class="checkbox-label">{{ label() }}</span>
  } @else {
    <ng-content></ng-content>
  }
</label>
