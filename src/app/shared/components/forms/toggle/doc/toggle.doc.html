<app-documentation-template
  title="Toggle"
  introduction="Le composant Toggle permet à l'utilisateur d'activer ou de désactiver une option en basculant entre deux états."
>
  <div overview>
    <app-flex direction="column" gap="xl" wrap fullWidth>
      <app-flex direction="column" gap="xl" wrap fullWidth>
        @for (variant of variants; track $index) {
          <app-flex direction="column" gap="sm">
            <h3>{{ variant.charAt(0).toUpperCase() + variant.slice(1) }}</h3>
            <app-flex direction="row" gap="md" wrap>
              @for (color of colors; track $index) {
                <app-toggle
                  [variant]="variant"
                  [color]="color"
                  size="lg"
                  [(checked)]="toggleCheckedColorsVariants[`${variant}-${color}`]"
                />
              }
            </app-flex>
          </app-flex>
        }
      </app-flex>

      <app-flex direction="column" gap="sm">
        <h3>Sizes</h3>
        <app-flex direction="row" gap="md" alignItems="center" wrap>
          @for (size of sizes; track $index) {
            @for (variant of variants; track $index) {
              <app-toggle
                [variant]="variant"
                color="blue"
                [size]="size"
                [(checked)]="toggleCheckedSizesVariants[`${variant}-${size}`]"
              />
            }
          }
        </app-flex>
      </app-flex>
    </app-flex>
  </div>

  <div properties>
    <!-- Propriétés du composant accordion -->
  </div>

  <div usage>
    <!-- Instructions d'utilisation -->
  </div>
</app-documentation-template>
