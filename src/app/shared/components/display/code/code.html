<app-flex direction="column" gap="sm">
  <!-- Body -->
  <div class="code-content">
    <pre><code #codeBlock [attr.data-language]="language()"></code></pre>

    <!-- @if (showCopy()) { -->
    <app-button
      class="copy-button"
      variant="ghost"
      color="gray"
      size="sm"
      [iconLeft]="copied() ? 'lucideCheck' : 'lucideCopy'"
      [tooltip]="{
        content: copied() ? 'Copié' : 'Copier',
      }"
      (clicked)="copyCode()"
    />
    <!-- } -->
  </div>
</app-flex>
