<app-documentation-template
  title="Badge"
  introduction="Déclencher une action ou un événement en un clic, comme la soumission d'un formulaire ou l'affichage d'une boîte de dialogue.
  Les boutons contiennent généralement du texte qui indique l'action qu'ils effectuent."
  codeExample="const hello = 'world';"
>
  <app-flex usage direction="column" gap="2xl" wrap fullWidth>
    <!-- Couleurs -->
    <app-documentation-usage
      title="Couleurs"
      description="Le composant Badge prend en charge plusieurs couleurs pour s'adapter à différents contextes d'utilisation."
    >
      <app-flex direction="row" gap="sm" wrap>
        @for (color of colors; track $index) {
          <app-badge
            [text]="`${color.charAt(0).toUpperCase() + color.slice(1)}`"
            variant="solid"
            [color]="color"
            size="sm"
            [icon]="{ name: 'lucideCircle' }"
          />
        }
      </app-flex>
    </app-documentation-usage>

    <!-- Variants -->
    <app-documentation-usage
      title="Variants"
      description="Le composant Badge prend en charge plusieurs variantes pour s'adapter à différents contextes d'utilisation."
    >
      <app-flex direction="row" gap="sm" wrap>
        @for (variant of variants; track $index) {
          <app-badge
            [text]="`${variant.charAt(0).toUpperCase() + variant.slice(1)}`"
            [variant]="variant"
            color="primary"
            size="sm"
            [icon]="{ name: 'lucideCircle' }"
          />
        }
      </app-flex>
    </app-documentation-usage>

    <!-- Tailles -->
    <app-documentation-usage
      title="Tailles"
      description="Le composant Badge prend en charge plusieurs tailles pour s'adapter à différents contextes d'utilisation."
    >
      <app-flex direction="row" gap="sm" alignItems="center" wrap>
        @for (size of sizes; track $index) {
          <app-badge
            [text]="`${size.charAt(0).toUpperCase() + size.slice(1)}`"
            variant="soft"
            color="primary"
            [size]="size"
            [icon]="{ name: 'lucideStar' }"
          />
        }
      </app-flex>
    </app-documentation-usage>

    <!-- Icones -->
    <app-documentation-usage
      title="Avec Icônes"
      description="Le composant Badge peut inclure des icônes pour améliorer la reconnaissance visuelle."
    >
      <app-flex direction="row" gap="md" wrap alignItems="center">
        <app-badge
          text="Success"
          variant="solid"
          color="green"
          size="sm"
          [icon]="{ name: 'lucideCheck' }"
        />
        <app-badge
          text="Warning"
          variant="solid"
          color="orange"
          size="sm"
          [icon]="{ name: 'lucideAlertTriangle' }"
        />
        <app-badge
          text="Error"
          variant="solid"
          color="red"
          size="sm"
          [icon]="{ name: 'lucideX' }"
        />
        <app-badge text="Info" variant="soft" size="sm" [icon]="{ name: 'lucideInfo' }" />
        <app-badge
          text="New"
          variant="outline"
          color="purple"
          size="sm"
          [icon]="{ name: 'lucideSparkles' }"
        />
      </app-flex>
    </app-documentation-usage>
  </app-flex>
</app-documentation-template>
