<app-flex direction="row" alignItems="center" justifyContent="center" [gap]="gapSize()" fullWidth>
  <!-- Icon -->
  @if (icon()?.name) {
    <app-icon [color]="contentColor()" [name]="icon()!.name" [size]="size()" />
  }

  <!-- Message -->
  @if (text()) {
    <app-text as="p" [color]="contentColor()" size="sm">{{ text() }}</app-text>
  }
</app-flex>
