<app-flex direction="row" alignItems="center" justifyContent="center" gap="xs" fullWidth>
  <!-- Icon -->
  @if (icon()?.name) {
    <app-icon [variant]="contentColor()" [name]="icon()!.name" size="20" />
  }

  <!-- Message -->
  @if (text()) {
    <app-text as="p" [variant]="contentColor()" size="sm">{{ text() }}</app-text>
  }
</app-flex>
