<app-documentation-template title="app-text">
  <div introduction></div>

  <div overview>
    <app-flex direction="column" gap="sm" wrap>
      <h3>Sizes</h3>
      <app-flex direction="row" gap="sm" alignItems="center" wrap>
        @for (size of textSizes; track $index) {
          <app-text [size]="size" color="primary">{{ size }}</app-text>
        }
      </app-flex>
    </app-flex>

    <app-flex direction="column" gap="sm" wrap>
      <h3>Weights</h3>
      <app-flex direction="row" gap="sm" alignItems="end" wrap>
        @for (weight of textWeights; track $index) {
          <app-text [weight]="weight" color="primary">{{ weight }}</app-text>
        }
      </app-flex>
    </app-flex>
  </div>

  <div properties></div>

  <div usage></div>
</app-documentation-template>
