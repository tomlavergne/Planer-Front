@if (text()) {
  <app-flex
    [direction]="orientation() === 'horizontal' ? 'row' : 'column'"
    alignItems="center"
    justifyContent="center"
    gap="sm"
    fullWidth
  >
    <div class="line"></div>

    <app-text color="text-secondary">{{ text() }}</app-text>

    <div class="line"></div>
  </app-flex>
} @else {
  <div class="line"></div>
}
