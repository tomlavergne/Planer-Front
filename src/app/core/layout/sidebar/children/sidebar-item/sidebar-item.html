<app-button
  [text]="expanded() ? text() : ''"
  [iconLeft]="icon()!"
  [variant]="isActive() ? 'soft' : 'ghost'"
  [color]="isActive() ? 'primary' : 'secondary'"
  [size]="size()"
  [tabindex]="-1"
  fullWidth
  [tooltip]="{
    content: !expanded() ? text() : '',
    position: 'right',
    disabled: expanded(),
  }"
/>
