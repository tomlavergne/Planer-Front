<a
  [routerLink]="routerLink()"
  routerLinkActive="active"
  #rla="routerLinkActive"
  (click)="onClick()"
  [tooltip]="{
    content: label(),
    position: 'right',
    disabled: expanded(),
  }"
>
  <app-flex direction="row" alignItems="center" gap="xs">
    <app-icon [name]="iconName()!" size="xs" [color]="rla.isActive ? 'green' : 'gray'"></app-icon>

    @if (expanded() == true) {
      <app-text [color]="rla.isActive ? 'green' : 'gray'" size="xs" class="label">{{
        label()
      }}</app-text>
    }
  </app-flex>
</a>
