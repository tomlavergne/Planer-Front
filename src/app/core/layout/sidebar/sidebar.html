<app-flex direction="column" gap="2xs" padding="sm" fullHeight class="flexy">
  <!-- Resize handle -->
  <div
    class="resize-handle"
    [class.collapsed]="!expanded()"
    [class.resizing]="isResizing()"
    [tooltip]="{
      content: resizeHandleTooltip(),
      position: 'right',
      delay: 500,
      followMouse: true,
    }"
    (mousedown)="onResizeStart($event)"
  ></div>

  <!-- Header -->
  <app-flex alignItems="center" justifyContent="between" gap="sm">
    <!-- Planer Button -->
    <app-button
      variant="ghost"
      color="gray"
      size="xs"
      [tooltip]="
        expanded()
          ? null
          : {
              content: 'Accueil',
              position: 'right',
              delay: 500,
            }
      "
    >
      <app-flex alignItems="center" gap="2xs">
        <!-- Logo Icon -->
        <div class="circle"></div>

        @if (expanded()) {
          <!-- Logo Text -->
          <app-text size="lg" weight="medium" color="text">Planer</app-text>

          <!-- Chevron Icon -->
          <app-icon name="lucideChevronDown" size="xs" color="text" class="home-icon" />
        }
      </app-flex>
    </app-button>

    @if (expanded()) {
      <app-sidebar-item
        label="Documentation"
        iconName="lucideFileText"
        routerLink="/documentation"
        [expanded]="false"
      />
    }
  </app-flex>

  <app-separator />

  <!-- Navigation principale -->
  <app-flex direction="column" gap="2xs" fullWidth fullHeight>
    <app-sidebar-item
      label="Accueil"
      iconName="lucideHome"
      routerLink="/home"
      [expanded]="expanded()"
    />
    <app-sidebar-item
      label="Calendrier"
      iconName="lucideCalendar"
      routerLink="/calendar"
      [expanded]="expanded()"
    />
    <app-sidebar-item
      label="Utilisateurs"
      iconName="lucideUsers"
      routerLink="/users"
      [expanded]="expanded()"
    />
    <app-sidebar-item
      label="Ressources"
      iconName="lucideBox"
      routerLink="/ressources"
      [expanded]="expanded()"
    />

    @if (expanded()) {
      <app-accordion
        title="Plus"
        variant="ghost"
        size="sm"
        iconLeftName="lucideEllipsis"
        [contentPadding]="false"
        startOpen
      >
        <app-flex
          direction="column"
          alignItems="center"
          gap="2xs"
          class="accordion-header"
          fullWidth
        >
          <app-sidebar-item
            label="Projet A"
            iconName="lucideFolder"
            routerLink="/projects/a"
            [expanded]="expanded()"
          />
          <app-sidebar-item
            label="Projet B"
            iconName="lucideFolder"
            routerLink="/projects/b"
            [expanded]="expanded()"
          />
          <app-sidebar-item
            label="Projet C"
            iconName="lucideFolder"
            routerLink="/projects/c"
            [expanded]="expanded()"
          />
        </app-flex>
      </app-accordion>

      <app-button
        [text]="'Plus'"
        variant="ghost"
        color="gray"
        size="sm"
        iconLeft="lucideEllipsis"
        fullWidth
      />
    }
  </app-flex>

  <!-- Footer -->
  <app-flex direction="column" gap="2xs" fullWidth>
    <app-button
      [text]="expanded() ? 'Thème ' + (currentTheme() === 'light' ? 'sombre' : 'clair') : ''"
      variant="ghost"
      color="gray"
      size="sm"
      [iconLeft]="iconNameTheme()"
      (clicked)="toggleTheme()"
      [tooltip]="{
        content: 'Thème ' + (currentTheme() === 'light' ? 'sombre' : 'clair'),
        position: 'right',
        delay: 500,
        disabled: expanded(),
      }"
      fullWidth
    />
    <app-sidebar-item
      label="Paramètres"
      iconName="lucideSettings"
      routerLink="/settings"
      [expanded]="expanded()"
    />

    <app-separator />

    <app-button variant="ghost" color="gray" size="xs" fullWidth>
      <app-flex
        direction="row"
        alignItems="center"
        [justifyContent]="expanded() ? 'between' : 'center'"
        gap="xs"
        fullWidth
      >
        <app-flex direction="row" alignItems="center" gap="2xs">
          <app-avatar imageUrl="/img/profil.png" [size]="expanded() ? 'sm' : 'xs'" />

          @if (expanded()) {
            <app-flex direction="column" gap="4xs">
              <app-text color="gray" size="sm" weight="medium">Tom Lavergne</app-text>
            </app-flex>
          }
        </app-flex>

        @if (expanded()) {
          <app-icon name="lucideChevronsUpDown" size="xs" color="gray" />
        }
      </app-flex>
    </app-button>
  </app-flex>
</app-flex>
