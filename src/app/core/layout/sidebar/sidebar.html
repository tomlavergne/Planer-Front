<app-flex direction="column" gap="xs" fullHeight>
  @if (showGoBackButton()) {
    <app-button
      text="Retour"
      iconLeft="lucideChevronLeft"
      variant="ghost"
      size="sm"
      (clicked)="goBack()"
    />
  }

  <ng-content> </ng-content>
</app-flex>

<!-- Resize handle -->
@if (expandable()) {
  <div
    class="resize-handle"
    [class.collapsed]="!expanded()"
    [class.resizing]="isResizing()"
    [tooltip]="{
      content: resizeHandleTooltip(),
      position: 'right',
      delay: 500,
      followMouse: true,
    }"
    (mousedown)="onResizeStart($event)"
  ></div>
}
