<ng-content></ng-content>

<!-- Resize handle -->
@if (expandable()) {
  <div
    class="resize-handle"
    [class.collapsed]="!expanded()"
    [class.resizing]="isResizing()"
    [tooltip]="{
      content: resizeHandleTooltip(),
      position: 'right',
      delay: 500,
      followMouse: true,
    }"
    (mousedown)="onResizeStart($event)"
  ></div>
}
