<app-flex direction="row" gap="lg" alignItems="center" justifyContent="center" fullHeight fullWidth>
  <app-flex direction="column" padding="3xl" justifyContent="center" gap="sm" fullHeight fullWidth>
    <!-- Go back button -->
    <app-button
      variant="ghost"
      iconLeft="lucideArrowLeft"
      size="md"
      [text]="'common.back' | transloco"
      (clicked)="goBack()"
    />
    @if (mode() === 'login') {
      <app-email-request (submit)="requestOtp($event.email)" />
    } @else if (mode() === 'otp') {
      <app-otp-verification />
    }
  </app-flex>
</app-flex>
