<app-flex class="code-exemple" direction="column" fullWidth wrap>
  <!-- Demo -->
  <app-flex class="demo" alignItems="center" justifyContent="center" fullWidth wrap>
    <ng-content></ng-content>

    <app-badge
      text="Preview"
      variant="soft"
      color="secondary"
      size="sm"
      borderRadius="full"
      class="preview-badge"
    />
  </app-flex>

  <!-- Code -->
  @if (code()) {
    <app-code [code]="code()!" language="html" />
  }
</app-flex>
