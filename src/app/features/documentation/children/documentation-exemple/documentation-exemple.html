<app-card>
  <div card-header>
    <ng-content></ng-content>
  </div>
  <app-flex class="demo" direction="column" alignItems="center">
    <ng-content></ng-content>
  </app-flex>

  <app-badge
    text="Preview"
    variant="solid"
    color="secondary"
    size="sm"
    borderRadius="full"
    class="preview-badge"
  />

  @if (code()) {
    <div card-footer>
      <!-- Code -->

      <app-code [code]="code()!" language="html" />
    </div>
  }
</app-card>
