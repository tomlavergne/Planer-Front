<app-documentation-template title="Icons">
  <div examples>
    <app-flex direction="column" gap="lg" wrap fullWidth>
      <app-text size="md" color="text" weight="medium"
        >Toutes les icônes Lucide ({{ iconNames.length }} icônes)</app-text
      >

      <app-grid columns="5" gap="md">
        @for (iconName of iconNames; track iconName) {
          <app-button variant="soft" color="gray" fullWidth (clicked)="copyIconName(iconName)">
            <app-flex
              direction="column"
              gap="2xs"
              alignItems="center"
              justifyContent="center"
              fullWidth
            >
              <app-icon [name]="iconName" size="lg" color="text" />

              <app-text
                size="sm"
                color="text"
                style="word-break: break-all; text-align: center"
                truncate
              >
                {{ iconName }}
              </app-text>
            </app-flex>
          </app-button>
        }
      </app-grid>
    </app-flex>
  </div>

  <div properties>
    <!-- Propriétés du composant accordion -->
  </div>

  <div usage>
    <!-- Instructions d'utilisation -->
  </div>
</app-documentation-template>
