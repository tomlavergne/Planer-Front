@let currentItem = item();

@if (isSection(currentItem)) {
  <!-- Section avec contenu -->
  @let section = currentItem;
  <app-accordion
    [title]="section.title"
    variant="ghost"
    size="sm"
    titleWeight="semibold"
    [iconLeftName]="section.icon!"
    [startOpen]="false"
  >
    <app-flex direction="column" gap="2xs" fullWidth>
      @for (child of section.content; track $index) {
        <app-documentation-index-item [item]="child" />
      }
    </app-flex>
  </app-accordion>
} @else if (isItem(currentItem)) {
  <!-- Item simple avec lien -->
  @let itemData = currentItem;

  <app-button
    [routerLink]="itemData.path"
    routerLinkActive="active"
    #rla="routerLinkActive"
    [text]="itemData.title"
    [variant]="rla.isActive ? 'soft' : 'ghost'"
    [color]="rla.isActive ? 'blue' : 'gray'"
    size="xs"
    fullWidth
  />
}
