<app-flex direction="column" gap="3xl" padding="3xl" wrap fullWidth>
  <!-- En tête -->
  <app-flex direction="column" gap="xl" fullWidth>
    <!-- Première ligne -->
    <app-flex direction="row" gap="sm" justifyContent="between" alignItems="center" fullWidth>
      <app-text size="3xl" color="text" weight="semibold">{{ title() }}</app-text>

      <!-- Navigation entre les composants -->
      <app-flex direction="row" gap="sm" wrap>
        <app-button
          variant="soft"
          color="gray"
          size="sm"
          iconLeft="lucideArrowLeft"
          [disabled]="!navigation().previous"
          [tooltip]="{
            content: getRouteName(navigation().previous!),
          }"
          (clicked)="goToPrevious()"
        />

        <app-button
          variant="soft"
          color="gray"
          size="sm"
          iconLeft="lucideArrowRight"
          [disabled]="!navigation().next"
          [tooltip]="{
            content: getRouteName(navigation().next!),
          }"
          (clicked)="goToNext()"
        />
      </app-flex>
    </app-flex>

    <!-- Introduction -->
    @if (introduction()) {
      <app-text size="md" color="secondary" weight="regular">
        {{ introduction() }}
      </app-text>
    }

    <!-- Liens rapides -->
    <app-flex direction="row" gap="sm" wrap>
      <app-button
        text="Code d'exemple"
        variant="soft"
        color="gray"
        size="sm"
        iconLeft="lucideCode"
      />

      <app-button
        text="API"
        variant="soft"
        color="gray"
        size="sm"
        iconLeft="lucideTable"
        (clicked)="scrollToAPI()"
      />
    </app-flex>

    <app-separator />
  </app-flex>

  <app-flex direction="column" gap="sm">
    <app-text size="xl" color="text" weight="semibold">Vue d'ensemble :</app-text>

    <app-card variant="outline" fullWidth>
      <ng-content select="[overview]"></ng-content>
    </app-card>
  </app-flex>

  <app-code [code]="codeExample()!" [language]="'typescript'" [title]="'Exemple TypeScript'" />

  <app-flex id="api-section" direction="column" gap="xl" fullWidth>
    <app-text size="xl" color="text" weight="semibold">API :</app-text>

    <!-- Inputs -->
    @if (inputs()) {
      <app-flex direction="column" gap="sm" fullWidth>
        <app-text size="lg" color="text" weight="semibold">Inputs :</app-text>

        <app-table
          [columns]="inputsColumns"
          [data]="inputs()!"
          [sortable]="false"
          [resizable]="true"
        />
      </app-flex>
    }

    @if (outputs()) {
      <!-- Outputs -->
      <app-flex direction="column" gap="sm" fullWidth>
        <app-text size="lg" color="text" weight="semibold">Outputs :</app-text>

        <app-table
          [columns]="outputsColumns"
          [data]="outputs()!"
          [sortable]="false"
          [resizable]="true"
        />
      </app-flex>
    }
  </app-flex>

  <!-- Navigation entre les pages -->
  <app-flex direction="column" justifyContent="between" gap="md">
    <app-separator />
    <!-- Boutons de navigation -->
    <app-flex justifyContent="between" alignItems="center" gap="md">
      @if (navigation().previous) {
        <app-button
          [text]="getRouteName(navigation().previous!)"
          variant="soft"
          color="gray"
          size="sm"
          iconLeft="lucideArrowLeft"
          [routerLink]="['/documentation', navigation().previous]"
          (clicked)="goToPrevious()"
        />
      } @else {
        <div></div>
      }

      <app-flex direction="column" alignItems="center" gap="sm">
        <app-text size="xs" color="secondary">
          {{ navigation().currentIndex + 1 }} / {{ navigation().total }}
        </app-text>
      </app-flex>

      @if (navigation().next) {
        <app-button
          [text]="getRouteName(navigation().next!)"
          variant="soft"
          color="gray"
          size="sm"
          iconRight="lucideArrowRight"
          [routerLink]="['/documentation', navigation().next]"
          (clicked)="goToNext()"
        />
      }
    </app-flex>
  </app-flex>
</app-flex>
