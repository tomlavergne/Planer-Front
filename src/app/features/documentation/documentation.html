<app-flex direction="row" fullHeight>
  <div class="documentation-sidebar">
    <app-flex direction="column" gap="2xs" padding="sm">
      <app-accordion
        title="Composants"
        variant="ghost"
        size="sm"
        iconLeftName="lucideComponent"
        startOpen
      >
        <app-flex direction="column" gap="xl" fullWidth>
          <!-- Layout -->
          <app-flex direction="column" gap="2xs" fullWidth>
            <app-text size="xs" weight="semibold" color="gray">Layout</app-text>

            <app-sidebar-item
              label="Flex"
              iconName="lucideAlignHorizontalJustifyStart"
              routerLink="/documentation/flex"
              [expanded]="true"
            />
            <app-sidebar-item
              label="Grid"
              iconName="lucideGrid2X2"
              routerLink="/documentation/grid"
              [expanded]="true"
            />
          </app-flex>

          <!-- Panel -->
          <app-flex direction="column" gap="2xs" fullWidth>
            <app-text size="xs" weight="semibold" color="gray">Panel</app-text>

            <app-sidebar-item
              label="Accordion"
              iconName="lucideListChevronsDownUp"
              routerLink="/documentation/accordion"
              [expanded]="true"
            />
            <app-sidebar-item
              label="Card"
              iconName="lucideSquare"
              routerLink="/documentation/card"
              [expanded]="true"
            />
          </app-flex>

          <!-- Display -->
          <app-flex direction="column" gap="2xs" fullWidth>
            <app-text size="xs" weight="semibold" color="gray">Display</app-text>

            <app-sidebar-item
              label="Text"
              iconName="lucideCaseSensitive"
              routerLink="/documentation/text"
              [expanded]="true"
            />
            <app-sidebar-item
              label="Icon"
              iconName="lucideSmile"
              routerLink="/documentation/icon"
              [expanded]="true"
            />
            <app-sidebar-item
              label="Badge"
              iconName="lucideTag"
              routerLink="/documentation/badge"
              [expanded]="true"
            />
          </app-flex>

          <!-- Form -->
          <app-flex direction="column" gap="2xs" fullWidth>
            <app-text size="xs" weight="semibold" color="gray">Form</app-text>

            <app-sidebar-item
              label="Button"
              iconName="lucideSquareArrowDown"
              routerLink="/documentation/button"
              [expanded]="true"
            />

            <app-sidebar-item
              label="Toggle"
              iconName="lucideToggleLeft"
              routerLink="/documentation/toggle"
              [expanded]="true"
            />
          </app-flex>

          <!-- Feedback -->
          <app-flex direction="column" gap="2xs" fullWidth>
            <app-text size="xs" weight="semibold" color="gray">Feedback</app-text>

            <app-sidebar-item
              label="Alert"
              iconName="lucideMessageSquareWarning"
              routerLink="/documentation/alert"
              [expanded]="true"
            />
          </app-flex>

          <!-- Design -->
          <app-flex direction="column" gap="2xs" fullWidth>
            <app-text size="xs" weight="semibold" color="gray">Design</app-text>

            <app-sidebar-item
              label="Ripple"
              iconName="lucideWaves"
              routerLink="/documentation/ripple"
              [expanded]="true"
            />
          </app-flex>
        </app-flex>
      </app-accordion>
      <app-accordion
        title="Directives"
        variant="ghost"
        size="sm"
        iconLeftName="lucidePencilRuler"
        startOpen
      >
        <app-flex direction="column" gap="2xs" fullWidth>
          <app-sidebar-item
            label="Tooltip"
            iconName="lucideMessageSquare"
            routerLink="/documentation/tooltip"
            [expanded]="true"
          />
          <app-sidebar-item
            label="Popover"
            iconName="lucideSquaresUnite"
            routerLink="/documentation/popover"
            [expanded]="true"
          />
        </app-flex>
      </app-accordion>
      <app-accordion
        title="Logique"
        variant="ghost"
        size="sm"
        iconLeftName="lucideBrainCircuit"
        startOpen
      >
      </app-accordion>
    </app-flex>
  </div>

  <app-flex direction="column" gap="lg" padding="xl" fullWidth fullHeight>
    <router-outlet />
  </app-flex>
</app-flex>
