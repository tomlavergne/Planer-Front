<app-setting-template
  [title]="'settings.general.preferences.label' | transloco"
  [description]="'settings.general.preferences.description' | transloco"
>
  <app-setting-group [title]="'settings.general.preferences.general.label' | transloco">
    <app-setting-item
      [title]="'settings.general.preferences.general.language.label' | transloco"
      [description]="'settings.general.preferences.general.language.description' | transloco"
    >
      <app-select
        [options]="languageSelectOptions"
        [value]="currentLanguage()"
        (valueChange)="setLanguage($event)"
      />
    </app-setting-item>
  </app-setting-group>

  <app-setting-group [title]="'settings.general.preferences.appearance.label' | transloco">
    <app-setting-item
      [title]="'settings.general.preferences.appearance.theme.label' | transloco"
      [description]="'settings.general.preferences.appearance.theme.description' | transloco"
    >
      <app-segmented-control
        [options]="[
          {
            label: 'settings.general.preferences.appearance.theme.options.light' | transloco,
            value: 'light',
            icon: 'lucideSun',
          },
          {
            label: 'settings.general.preferences.appearance.theme.options.dark' | transloco,
            value: 'dark',
            icon: 'lucideMoon',
          },
          {
            label: 'settings.general.preferences.appearance.theme.options.auto' | transloco,
            value: 'auto',
            icon: 'lucideMonitor',
          },
        ]"
        [value]="themeService.theme()"
        (valueChange)="setTheme($event)"
      />
    </app-setting-item>

    <app-separator />

    <app-setting-item
      [title]="'settings.general.preferences.appearance.primaryColor.label' | transloco"
      [description]="'settings.general.preferences.appearance.primaryColor.description' | transloco"
    >
      <app-select
        [options]="primaryColorSelectOptions"
        [selectedValueDisplayed]="
          `settings.general.preferences.appearance.primaryColor.options.${themeService.primaryColor()}`
            | transloco
        "
        [value]="themeService.primaryColor()"
        (valueChange)="setPrimaryColor($event)"
      >
        <ng-template selectOption let-option>
          <app-flex direction="row" alignItems="center" justifyContent="start" gap="2xs" fullWidth>
            <app-box height="20px" width="30px" [color]="option.value" />
            <app-text color="text-secondary">{{
              `settings.general.preferences.appearance.primaryColor.options.${option.label}`
                | transloco
            }}</app-text>
          </app-flex>
        </ng-template>
      </app-select>
    </app-setting-item>
  </app-setting-group>
</app-setting-template>
